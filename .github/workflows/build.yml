name: Build AdemClient

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract project ZIP
        run: |
          unzip -q AdemClient2-fixed.zip
          cd AdemClient2
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Check project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project directory: $PWD"
          ls -la
          ls -la gradle/wrapper || true

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR is missing."
            echo "Installing Gradle 7.6.4 to generate the wrapper..."

            mkdir -p "$HOME/gradle"
            curl -L \
              -o "$HOME/gradle/gradle.zip" \
              https://services.gradle.org/distributions/gradle-7.6.4-bin.zip

            unzip -q "$HOME/gradle/gradle.zip" -d "$HOME/gradle"

            "$HOME/gradle/gradle-7.6.4/bin/gradle" wrapper
          fi

          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdemClient-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
