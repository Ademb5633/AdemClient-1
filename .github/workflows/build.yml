name: Build AdemClient

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q AdemClient2-fixed.zip

          echo "Project contents:"
          ls -la AdemClient2

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle wrapper
        working-directory: AdemClient2
        run: |
          chmod +x gradlew

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR is missing."
            echo "Generating Gradle 7.6.4 wrapper..."

            mkdir -p "$HOME/gradle"

            curl -L \
              -o "$HOME/gradle/gradle.zip" \
              https://services.gradle.org/distributions/gradle-7.6.4-bin.zip

            unzip -q "$HOME/gradle/gradle.zip" -d "$HOME/gradle"

            "$HOME/gradle/gradle-7.6.4/bin/gradle" wrapper
          fi

          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Show Gradle version
        working-directory: AdemClient2
        run: ./gradlew --version

      - name: Build AdemClient
        working-directory: AdemClient2
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdemClient-jar
          path: AdemClient2/build/libs/*.jar
          if-no-files-found: error
